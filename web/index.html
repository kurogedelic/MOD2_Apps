<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>MOD2 Apps</title>
  <meta name="description" content="MOD2 firmware web flasher.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>MOD2 Apps</h1>
      <a href="https://github.com/kurogedelic/MOD2_Apps" aria-label="GitHub repository">GitHub</a>
    </header>

    <section id="browser-warning" class="alert hidden" role="alert">WebUSB unavailable.</section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search apps">
      <select id="group-filter" aria-label="Main category">
        <option value="all">All</option>
        <option value="Source">Source</option>
        <option value="Effect">Effect</option>
        <option value="Utility">Utility</option>
      </select>
      <select id="category-filter" aria-label="Category">
        <option value="all">All categories</option>
      </select>
      <div id="status" class="status" aria-live="polite">Ready</div>
    </section>

    <section id="apps" class="apps" aria-live="polite"></section>
  </main>

  <div id="flash-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="flash-title">
    <div class="flash-panel">
      <h2 id="flash-title">Flashing</h2>
      <p id="flash-stage">Preparing…</p>
      <div class="progress"><div id="progress-bar"></div></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
